<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Prompt Optimizer</title>
    <!-- Google Translate Injection -->
    <style>
      .skiptranslate iframe { display: none !important; }
      body { top: 0px !important; }
      #goog-gt-tt { display: none !important; }
      .goog-te-balloon-frame { display: none !important; }
      .goog-te-gadget { color: transparent !important; }
      .goog-te-gadget .goog-te-combo { margin: 4px 0 !important; border-radius: 4px; padding: 4px; border: 1px solid #30363d; background: #161b22; color: #f0f6fc; }
    </style>
    <script type="text/javascript">
      function googleTranslateElementInit() {
        new google.translate.TranslateElement({
          pageLanguage: 'en',
          includedLanguages: 'vi',
          layout: google.translate.TranslateElement.InlineLayout.SIMPLE,
          autoDisplay: false
        }, 'google_translate_element');
        
        // Auto-translate to Vietnamese on load
        setTimeout(function() {
          var select = document.querySelector('.goog-te-combo');
          if (select) {
            select.value = 'vi';
            select.dispatchEvent(new Event('change'));
          }
        }, 500);
      }
    </script>
    <script type="text/javascript" src="https://translate.google.com/translate_a/element.js?cb=googleTranslateElementInit"></script>

    <script type="module" crossorigin src="./assets/popup.js"></script>
    <link rel="modulepreload" crossorigin href="./assets/chunk-2UW5RY7Z.js">
    <link rel="modulepreload" crossorigin href="./assets/dist.js">
    <link rel="modulepreload" crossorigin href="./assets/image-asset-storage-DdMLBQcQ.js">
    <link rel="modulepreload" crossorigin href="./assets/AppPreviewImageGroup-B6d9_A8Z.js">
    <link rel="modulepreload" crossorigin href="./assets/favorite-media-9jnryuTY.js">
    <link rel="modulepreload" crossorigin href="./assets/PromptPanel-Bewjn-Wb.js">
    <link rel="modulepreload" crossorigin href="./assets/Upload-Bc0bQA-N.js">
    <link rel="modulepreload" crossorigin href="./assets/favorite-category-path-CeLT-oZ9.js">
    <link rel="modulepreload" crossorigin href="./assets/favorites-page-context-Cex8BWXc.js">
    <link rel="modulepreload" crossorigin href="./assets/light-Bzn2sH3g.js">
    <link rel="stylesheet" crossorigin href="./assets/popup.css">
  </head>
  <body>
    <div id="google_translate_element" style="opacity: 0; pointer-events: none; position: absolute; width: 0; height: 0; overflow: hidden; z-index: -1;"></div>
    <div id="app"></div>
  </body>
</html>
